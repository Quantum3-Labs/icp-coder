services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icp-coder-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Persistent data volume (contains chromadb, motoko_code_samples, motoko_official_docs)
      - data-volume:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - icp-coder-network

volumes:
  data-volume:
    driver: local

networks:
  icp-coder-network:
    driver: bridge
