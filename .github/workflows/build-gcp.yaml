name: Build and Push to Artifact Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: asia-southeast1
  ARTIFACT_REGISTRY_LOCATION: asia-southeast1
  GCP_PROJECT: icp-coder
  ARTIFACT_REGISTRY_REPO: icp-coder

jobs:
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      ENVIRONMENT: ${{ steps.check_commit.outputs.ENVIRONMENT }}
      REPO_NAME: ${{ steps.check_commit.outputs.REPO_NAME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Environment
        id: check_commit
        run: |
          CURRENT_BRANCH=${GITHUB_REF#refs/heads/}

          if [[ "$CURRENT_BRANCH" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> "$GITHUB_OUTPUT"
          elif [[ "$CURRENT_BRANCH" == "stg" ]]; then
            echo "ENVIRONMENT=stg" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Workflow can only run on main or stg branches"
            exit 1
          fi

          echo "REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: check-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ needs.check-commit.outputs.REPO_NAME }}:${{ github.sha }}-${{ needs.check-commit.outputs.ENVIRONMENT }}
            ${{ env.ARTIFACT_REGISTRY_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ needs.check-commit.outputs.REPO_NAME }}:latest-${{ needs.check-commit.outputs.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Image Details
        if: success()
        run: |
          echo "Docker image built and pushed successfully!"
          echo ""
          echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"
          echo ""
          echo "Image Tags:"
          echo "${{ steps.docker_build.outputs.metadata }}" | jq -r '.["image.name"]'
          echo ""
          echo "Environment: ${{ needs.check-commit.outputs.ENVIRONMENT }}"
          echo "Repository: ${{ needs.check-commit.outputs.REPO_NAME }}"
          echo "Commit SHA: ${{ github.sha }}"

      - name: Notify Build Failure
        if: failure()
        run: |
          echo "::error::Docker build and push failed!"
          echo "::error::Environment: ${{ needs.check-commit.outputs.ENVIRONMENT }}"
          echo "::error::Repository: ${{ needs.check-commit.outputs.REPO_NAME }}"
          echo "::error::Commit SHA: ${{ github.sha }}"
          echo "::error::Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1